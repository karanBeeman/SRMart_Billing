plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.sr.mart'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    runtimeOnly 'org.postgresql:postgresql'
}

tasks.register('bootRunDev') {
    group = 'application'
    description = 'Running with local profile'
    dependsOn copyFrontend

//    doFirst {
//        tasks.bootRun.configure {
//            systemProperty('spring.profiles.active', 'local')
//        }
//    }

    finalizedBy('bootRun')
}

def frontendDir = file("../frontend")
node {
    version = '20.19.0'
    npmVersion = '10.0.0'
    download = true
    // Set your frontend directory
    nodeProjectDir = frontendDir
}

tasks.register('installFrontend', YarnTask) {
    args = ['install', '--immutable']
    workingDir = frontendDir
}

tasks.register('buildFrontend', com.github.gradle.node.npm.task.NpmTask) {
    args = ['run', 'build']
    workingDir = frontendDir
    dependsOn installFrontend
}

tasks.register('copyFrontend', Copy) {
    from '../frontend/dist'
    into 'src/main/resources/static'
    dependsOn buildFrontend
}

processResources.dependsOn 'copyFrontend'


tasks.named('test') {
    useJUnitPlatform()
}